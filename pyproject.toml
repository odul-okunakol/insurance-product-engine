[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-engine"
version = "1.0.0"
description = "Specification-driven quote engine for term life and hospital daily cash products (illustrative project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
product-engine = "product_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
